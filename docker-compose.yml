services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flyer
      POSTGRES_USER: flyer
      POSTGRES_PASSWORD: flyer
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyer -d flyer"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://flyer:flyer@postgres:5432/flyer
      REDIS_URL: redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes:
      - flyer_data:/data
      - type: bind
        source: ${DAVITA_TOKEN_FILE_HOST}
        target: /run/secrets/davita_dotenv
        read_only: true
      - type: bind
        source: ${ASSAI_BUNDLE_FILE_HOST}
        target: /run/secrets/meu_assai_bundle.js
        read_only: true
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://flyer:flyer@postgres:5432/flyer
      REDIS_URL: redis://redis:6379/0
    command: python -m app.scheduler
    volumes:
      - flyer_data:/data
      - type: bind
        source: ${DAVITA_TOKEN_FILE_HOST}
        target: /run/secrets/davita_dotenv
        read_only: true
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://flyer:flyer@postgres:5432/flyer
      REDIS_URL: redis://redis:6379/0
    command: python -m app.worker
    volumes:
      - flyer_data:/data
      - type: bind
        source: ${DAVITA_TOKEN_FILE_HOST}
        target: /run/secrets/davita_dotenv
        read_only: true
      - type: bind
        source: ${ASSAI_BUNDLE_FILE_HOST}
        target: /run/secrets/meu_assai_bundle.js
        read_only: true
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  flyer_data:
