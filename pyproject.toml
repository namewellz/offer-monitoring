[project]
name = "offer-monitoring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14", "apscheduler>=3.10", "beautifulsoup4>=4.12", "fastapi>=0.115",
  "httpx>=0.27", "lxml>=5.3", "pillow>=11.0", "psycopg[binary]>=3.2",
  "opencv-python-headless>=4.10",
  "pydantic-settings>=2.6", "redis>=5.2", "rq>=2.0", "sqlalchemy>=2.0",
  "rapidfuzz>=3.10", "structlog>=24.4", "tenacity>=9.0", "uvicorn[standard]>=0.32"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["external: requires external services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
